title = "Yi provider keys and shared path ignores"

[extend]
useDefault = true

[[rules]]
id = "yi-gemini-api-key"
description = "Gemini API key"
regex = '''\bAIza[0-9A-Za-z_-]{35}\b'''
keywords = ["aiza"]

[[rules]]
id = "yi-openrouter-api-key"
description = "OpenRouter API key"
regex = '''\bsk-or-v1-[\w-]{16,}'''
keywords = ["sk-or-v1-"]

[[rules]]
id = "yi-anthropic-api-key"
description = "Anthropic API key"
regex = '''\bsk-ant-[\w-]{16,}'''
keywords = ["sk-ant-"]

[[rules]]
id = "yi-openai-project-key"
description = "OpenAI project API key"
regex = '''\bsk-proj-[\w-]{16,}'''
keywords = ["sk-proj-"]

[[rules]]
id = "yi-openai-api-key"
description = "OpenAI API key"
regex = '''\bsk-[0-9A-Za-z]{48}\b'''
keywords = ["sk-"]

[[rules]]
id = "yi-github-pat"
description = "GitHub personal access token"
regex = '''\b(?:ghp|gho|ghs|ghu|ghr)_[A-Za-z0-9]{30,}'''
keywords = ["ghp_"]

[[rules]]
id = "yi-aws-access-key"
description = "AWS access key pair"
regex = '''\bAKIA[0-9A-Z]{16}\b'''
keywords = ["akia"]

[[allowlists]]
description = "RFC examples and test-only sentinel values, not credentials"
regexTarget = "secret"
regexes = [
  '''2YotnFZFEjr1zCsicMWpAA''',
  '''tGzv3JOkF0XG5Qx2TlKWIA''',
  '''e30\.eyJodHRwczovL2FwaS5vcGVuYWkuY29tL2F1dGgiOnsiY2hhdGdwdF9hY2NvdW50X2lkIjoiYWNjdC03In19\.sig''',
  '''SECRET=hunter2''',
  '''consecutive-401''',
  '''gpt-5\.6-sol\.md''',
]

[[allowlists]]
description = "The redaction tests' own fake values in crates/runtime/src/memory/doc.rs, matched by tail so a different key on the same line still reports"
regexTarget = "line"
regexes = [
  '''Qz7rT2mW9xK4vB1nL6pD3s''',
  '''4fJ9kL2mN7pQ1rS8tV3wX6yZ0aB5cD9eF2gH7iJ4kL1mN8oP3qR6''',
  '''8Hk2Lm9Np4Qr7St1Uv6Wx3Yz0Ab5Cd2Ef9Gh''',
  '''IOSFODNN7EXAMPLE''',
]
