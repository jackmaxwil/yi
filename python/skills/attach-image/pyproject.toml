[project]
name = "yi-skill-attach-image"
version = "0.1.0"
description = "Load on-disk images into the model's context as viewable attachments."
requires-python = ">=3.10"
# yi-runtime is always installed in the kernel venv before skills; not on PyPI.
dependencies = ["pillow>=10.0.0"]

[project.scripts]
attach_image = "rlm.skill:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/attach_image"]
