# Kernel-side package for the bundled plan skill. It only talks to the host
# through rlm.host_request; yi-runtime is always installed in the kernel venv
# before skills, so it is intentionally not declared as a dependency (it is
# not published on PyPI).
[project]
name = "plan"
version = "0.1.0"
description = "Yi plan skill: the session task DAG over the host bridge"
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plan"]
