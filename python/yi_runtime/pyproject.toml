[project]
name = "yi-runtime"
version = "0.1.0"
description = "Kernel-side runtime shim for Yi recursion"
requires-python = ">=3.11"
dependencies = [
  "ipykernel",
  "nest-asyncio",
  "tyro",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rlm"]
