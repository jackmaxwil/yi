default_job = "check"

[jobs.check]
command = ["cargo", "check", "--workspace", "--all-targets", "--color", "always"]
need_stdout = false

[jobs.clippy]
command = ["cargo", "clippy", "--workspace", "--all-targets", "--color", "always", "--", "-D", "warnings"]
need_stdout = false

[jobs.test]
command = ["cargo", "test", "--workspace", "--color", "always", "--", "--test-threads=1"]
need_stdout = true

[jobs.nextest]
command = ["cargo", "nextest", "run", "--workspace", "--profile", "local", "--color", "always", "--", "--skip", "linked_tables"]
need_stdout = true
analyzer = "nextest"
