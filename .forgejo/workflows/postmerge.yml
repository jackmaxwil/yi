# The T2 lane's away game: the journeys after the merge, the faux evals, the
# live suite that feeds the telemetry ledger, and the cache save every pull
# request restores. The dist-profile suite that used to run here moved to
# `dist-suite.yml` (#304): seven of this job's eight minutes, gating nothing.
#
# No macOS arm: the estate has no macOS runner, and `just prepush` is where the
# platform Yi is developed on gets covered.
name: postmerge

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # One arm left, so the matrix (and its fail-fast: false) went with the macOS
  # row it existed for.
  postmerge:
    # The recorder's commit is a push to main like any other, so the mirror runs for it; this lane
    # spends real money per merge on its live suite, and a docs commit has nothing to run.
    if: github.event.head_commit.author.name != 'yi-ci'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4 # zizmor: ignore[unpinned-uses,artipacked] Mirror SHA is unverified offline; the telemetry ledger pushes with its scoped token.
        with:
          fetch-depth: 0
      - run: rustup show
      # `test` is the PR gate's heaviest lane and the journeys build the same
      # dev profile, so a cache saved here — on refs/heads/main, the one scope
      # every pull request can read — is what makes a branch's first push warm
      # rather than cold.
      - uses: Swatinem/rust-cache@v2 # zizmor: ignore[unpinned-uses] Forgejo mirror SHA is unverified offline.
        with:
          shared-key: test
          cache-on-failure: true
      # The live ripwire journey and the browser journey read the plugins the table pins; the
      # cache keeps the downloads off the network until the table changes, and a failed add fails here.
      - uses: actions/cache@v4 # zizmor: ignore[unpinned-uses] Forgejo mirror SHA is unverified offline.
        with:
          path: ~/.yi/plugins
          key: yi-plugins-${{ hashFiles('crates/tools/src/plugin.rs') }}
      - run: cargo build -p yi-cli && target/debug/yi plugin add --all
      # The browser journey runs the pinned chrome-headless-shell, which links libraries the
      # image lacks. The list is the 155.0.8059.39 linux64 archive's own `deb.deps`, less what a
      # headless shell never loads (gtk, curl, vulkan, wget, xdg-utils); ldd names any still missing.
      - name: system libraries for the pinned headless Chrome
        run: |
          set -euo pipefail
          shell=$(ls ~/.yi/plugins/chrome/*/chrome-headless-shell-linux64/chrome-headless-shell)
          if ! ldd "$shell" | grep 'not found' >/dev/null; then exit 0; fi
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            fonts-liberation libasound2 libatk-bridge2.0-0 libatk1.0-0 libatspi2.0-0 libcairo2 \
            libcups2 libdbus-1-3 libexpat1 libgbm1 libglib2.0-0 libnspr4 libnss3 libpango-1.0-0 \
            libudev1 libx11-6 libxcb1 libxcomposite1 libxdamage1 libxext6 libxfixes3 \
            libxkbcommon0 libxrandr2 >/dev/null
          if ldd "$shell" | grep 'not found'; then exit 1; fi
      # The image carries just and the uv the kernel journey boots, so the
      # install steps the GitHub file needs are both gone.
      - run: just postmerge
      # Incident: a red journey skipped the evals and the live append behind it, so the telemetry
      # branch, 4 to 21 postmerge files a day until 2026-10-14, has had two since.
      - run: just postmerge-evals
        if: always()
      # The live suite on main is the lane's memory: one run per merge, appended to the
      # telemetry branch the PR verdicts read their baseline from. No secret, no run.
      - name: live suite on main, appended to the telemetry branch
        if: always()
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          EVAL_ROUTING: '{"order":["coreweave/nvfp4"],"allow_fallbacks":false}'
        run: |
          set -euo pipefail
          if [ -z "${OPENROUTER_API_KEY:-}" ]; then
            echo "live: no OPENROUTER_API_KEY secret; nothing appended"
            exit 0
          fi
          cargo build -p yi-cli
          mkdir -p live-out
          python3 evals/run.py --live --binary target/debug/yi \
            --model openrouter/deepseek/deepseek-v4-flash-0731 --cap-usd 1 --out live-out || true
          python3 scripts/live_ledger.py append live-out/run.json "${GITHUB_SHA}"
      # The issues this merge closed are annotated whether or not the away game
      # above went green: they are closed either way, and a version that never
      # reached them is a gap in the trail nothing later fills.
      - name: annotate the issues this merge closed
        if: always()
        env:
          FORGEJO_API_URL: ${{ github.api_url }}
          FORGEJO_REPOSITORY: ${{ github.repository }}
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/forge_tracking.py --comment-closed
      # A record job that stopped running left 271 change files unrecorded and nothing red on main;
      # this goes red past 10 unrecorded files or one older than 3 days, whatever the record job did.
      - name: unrecorded change files
        if: always()
        run: python3 scripts/record_changes.py --drift

  # Incident: pr.yml promised "one key per lane, shared with postmerge", but postmerge saved
  # only `test`, so `lint` and `guardrails` built cold on every pull request and a cold
  # `live` build was cancelled by the runner's clock three times in a row. A branch can read
  # only the caches main saved, so main saves every lane's key here, warm for the next push.
  # Invariant: `test` is in the matrix so each main commit carries the PR gate's own test lane
  # as a status; green pull requests that fail together turn that commit red within one run.
  warm:
    if: github.event.head_commit.author.name != 'yi-ci'
    strategy:
      fail-fast: false
      matrix:
        lane: [lint, guardrails, test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4 # zizmor: ignore[unpinned-uses] Forgejo mirror SHA is unverified offline.
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup show
      - uses: Swatinem/rust-cache@v2 # zizmor: ignore[unpinned-uses] Forgejo mirror SHA is unverified offline.
        with:
          shared-key: ${{ matrix.lane }}
          cache-on-failure: true
      # scripts/intake's selfcheck rewrites a scratch repo with the mirror's own filter, which
      # the gate image does not ship; the pin is scripts/mirror/filter-repo.version.
      - if: matrix.lane == 'guardrails'
        run: |
          uv tool install "git-filter-repo==$(cat scripts/mirror/filter-repo.version)"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: just lane ${{ matrix.lane }}

  # The version, the changelog and the decision log are views written from docs/changes (#975).
  # Off until the repository variable RECORD_CHANGES is `on`: the push to main needs a token that
  # branch protection lets through, and the first run, a backfill, is the owner's call.
  record:
    # The queue records its own landing, in the tick that pushed it.
    if: vars.RECORD_CHANGES == 'on' && github.event.head_commit.author.name != 'yi-queue'
    concurrency:
      group: record-changes
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_EXTRA_CA_CERTS: /etc/ssl/certs/buildhost-root-ca.pem
    outputs:
      ratchet_outcome: ${{ steps.ratchet.outcome }}
    steps:
      - uses: actions/checkout@v4 # zizmor: ignore[unpinned-uses] Forgejo mirror SHA is unverified offline.
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RECORDER_TOKEN }}
          persist-credentials: false
      - run: rustup show
      - uses: Swatinem/rust-cache@v2 # zizmor: ignore[unpinned-uses] Forgejo mirror SHA is unverified offline.
        with:
          shared-key: guardrails
          cache-on-failure: true
      - name: record the change files main landed
        env:
          GIT_AUTHOR_NAME: yi-ci
          GIT_AUTHOR_EMAIL: ci@yi
          GIT_COMMITTER_NAME: yi-ci
          GIT_COMMITTER_EMAIL: ci@yi
        run: |
          set -euo pipefail
          python3 scripts/record_changes.py
          if [ -n "$(git status --porcelain)" ]; then
            git add docs
            # Not silenced: the mirror runs only for a push to main, and this is the push that leaves
            # main final; the two lanes above skip a recorder commit by its author instead.
            git -c user.name=yi-ci -c user.email=ci@yi \
              commit -q -m "Record the change files main landed"
          fi
      - name: measure the Linux dist size
        id: ratchet
        continue-on-error: true
        env:
          GIT_AUTHOR_NAME: yi-ci
          GIT_AUTHOR_EMAIL: ci@yi
          GIT_COMMITTER_NAME: yi-ci
          GIT_COMMITTER_EMAIL: ci@yi
        run: python3 scripts/forge_pr.py ratchet --forge-measured
      - name: bundle the recording for a clean push
        if: always() && steps.ratchet.outcome != 'skipped'
        run: git bundle create "$RUNNER_TEMP/recorder.bundle" HEAD
      - uses: actions/upload-artifact@v3 # zizmor: ignore[unpinned-uses] Forgejo mirror SHA is unverified offline.
        if: always() && steps.ratchet.outcome != 'skipped'
        with:
          name: recorder
          path: ${{ runner.temp }}/recorder.bundle

  push:
    needs: [record]
    if: vars.RECORD_CHANGES == 'on' && github.event.head_commit.author.name != 'yi-queue'
    concurrency:
      group: record-changes
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NODE_EXTRA_CA_CERTS: /etc/ssl/certs/buildhost-root-ca.pem
    steps:
      - uses: actions/download-artifact@v3 # zizmor: ignore[unpinned-uses] Forgejo mirror SHA is unverified offline.
        with:
          name: recorder
          path: ${{ runner.temp }}
      - name: push the recording and ratchet commits
        env:
          RECORDER_TOKEN: ${{ secrets.RECORDER_TOKEN }}
          RATCHET_OUTCOME: ${{ needs.record.outputs.ratchet_outcome }}
        run: |
          set -euo pipefail
          export GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1
          push_workspace=$(mktemp -d "$RUNNER_TEMP/recorder-push.XXXXXX")
          git -c core.hooksPath=/dev/null -c core.fsmonitor=false \
            -c http.extraheader="Authorization: Bearer ${RECORDER_TOKEN}" \
            clone --template= --branch main --single-branch \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$push_workspace"
          git -C "$push_workspace" -c core.hooksPath=/dev/null -c core.fsmonitor=false \
            fetch "$RUNNER_TEMP/recorder.bundle" HEAD:refs/heads/recording
          git -C "$push_workspace" -c core.hooksPath=/dev/null -c core.fsmonitor=false \
            -c http.extraheader="Authorization: Bearer ${RECORDER_TOKEN}" push origin recording:main
          test "$RATCHET_OUTCOME" = "success"
