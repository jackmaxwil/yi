# A pinned plugin's output drifts when the pin moves, so the journey that runs the
# real program also runs before a merge that touches the table or its readers; the
# postmerge lane runs it after every merge.
name: plugins-live

on:
  pull_request:
    paths:
      - "crates/tools/src/plugin.rs"
      - "crates/tools/src/ripwire.rs"
      - "crates/tools/src/orient.rs"
      - "crates/tools/tests/fixtures/ripwire/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  the-pinned-plugins-answer-as-yi-reads:
    # Same hold as the gate: a contributor's plugin code waits for the owner's run-ci.
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'external') || contains(github.event.pull_request.labels.*.name, 'run-ci') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4 # zizmor: ignore[unpinned-uses] Forgejo mirror SHA is unverified offline.
        with:
          persist-credentials: false
      - run: rustup show
      - uses: Swatinem/rust-cache@v2 # zizmor: ignore[unpinned-uses] Forgejo mirror SHA is unverified offline.
        with:
          shared-key: test
          save-if: false
      - uses: actions/cache@v4 # zizmor: ignore[unpinned-uses] Forgejo mirror SHA is unverified offline.
        with:
          path: ~/.yi/plugins
          key: yi-plugins-${{ hashFiles('crates/tools/src/plugin.rs') }}
      - run: cargo build -p yi-cli && target/debug/yi plugin add --all
      # The adapter carries what this binary reports; its parser must read the real report.
      - run: |
          target/debug/yi plugin list --json | python3 -c 'import sys; sys.path.insert(0, "evals/adapters"); import yi_usage; carried = yi_usage.local_plugins({}, sys.stdin.read()); assert [n for n, _, _ in carried] == ["ripwire"], carried; print(yi_usage.plugins_label(carried))'
      - run: cargo test -p yi-tools --test integration tools::the_pinned_ripwire_answers_in_the_shapes_yi_reads -- --ignored --exact
      - run: cargo test -p yi-runtime --test integration skills_e2e::the_installed_ripwire_skills_match_the_recorded_release -- --ignored --exact
