# The milestone dates on the forge are measured from the forge's own closed
# issues, so they go stale the moment work lands; this is what re-measures them.
# Weekly rather than per-merge: a date that moves a day every push is noise, and
# the derivation only reads issue history, which a week's worth of merges moves.
#
# One repository per workflow file — `secrets.GITHUB_TOKEN` is scoped to the
# repository the job runs in, so apex/grid re-measures from its own copy.
name: tracking-hygiene

on:
  schedule:
    # 05:17 UTC Monday: no runner contention, and a Monday morning date is the
    # one an operator reads before planning the week.
    - cron: "17 5 * * 1"
  workflow_dispatch:

jobs:
  tracking:
    runs-on: ubuntu-latest
    # Two REST walks over 85 issues; a minute is generous and a hang is a bug.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: re-measure every open milestone's due date
        env:
          FORGEJO_API_URL: ${{ github.api_url }}
          FORGEJO_REPOSITORY: ${{ github.repository }}
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/forge_tracking.py --measure
      # After the re-measure, so the derivation it compares against is the one
      # just written; a red here is an issue or a date no one can fix by rerunning.
      - name: fail on an issue or a date the design does not allow
        env:
          FORGEJO_API_URL: ${{ github.api_url }}
          FORGEJO_REPOSITORY: ${{ github.repository }}
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/forge_tracking.py --hygiene
      # The bundled floor against the world (plan 2026-09-05 §3.G): drift is an issue, not a red.
      - name: catalog drift against models.dev and the providers
        env:
          FORGEJO_API_URL: ${{ github.api_url }}
          FORGEJO_REPOSITORY: ${{ github.repository }}
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/catalog_drift.py --issue || true

  # The adapter matrix and the variance run: the flash suite exercises one adapter, so the
  # other two run weekly at tight caps, and three flash runs give the baseline its spread.
  # Every leg skips with its reason when its secret is absent.
  live-weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: rustup show
      # `test` is the key postmerge saves on main; a key of its own stays cold (see pr.yml).
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          cache-on-failure: true
      - run: cargo build -p yi-cli
      - name: three flash runs, appended for variance
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${OPENROUTER_API_KEY:-}" ]; then echo "skip: no OPENROUTER_API_KEY"; exit 0; fi
          for n in 1 2 3; do
            python3 evals/run.py --live --binary target/debug/yi \
              --model openrouter/deepseek/deepseek-v4-flash-0731 --cap-usd 1 --out "live-$n" || true
            python3 scripts/live_ledger.py append "live-$n/run.json" "${GITHUB_SHA}-w$n"
          done
      - name: the anthropic adapter
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then echo "skip: no ANTHROPIC_API_KEY"; exit 0; fi
          python3 evals/run.py --live --binary target/debug/yi --model anthropic/claude-haiku-4-5 --cap-usd 0.5 --out live-anthropic || true
          python3 scripts/live_report.py live-anthropic/run.json
      - name: the openai-responses adapter
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${OPENAI_API_KEY:-}" ]; then echo "skip: no OPENAI_API_KEY"; exit 0; fi
          python3 evals/run.py --live --binary target/debug/yi --model openai/gpt-5.4-nano --cap-usd 0.5 --out live-openai || true
          python3 scripts/live_report.py live-openai/run.json
