# Before and after pictures of the TUI on every pull request that can change it: the scenes
# under scripts/proof/tui_see run on the base and the head binary, in real Ghostty where the
# scene allows, and one comment carries what changed. It never fails a pull request on looks
# (owner: "Never fail, just show"); a red run here means the scenes could not run.
name: tui

on:
  pull_request:
    paths:
      - "crates/tui/**"
      - "crates/console/**"
      - "crates/orb/**"
      - "scripts/tui_see.py"
      - "scripts/proof/tui_see/**"
      - ".forgejo/workflows/tui.yml"

concurrency:
  group: tui-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: "5"
  # Incident: upload-artifact runs on Node, which ignores the system store, and failed every
  # chunk with "unable to get local issuer certificate" against the forge's internal CA.
  NODE_EXTRA_CA_CERTS: /etc/ssl/certs/buildhost-root-ca.pem

jobs:
  # The yi-term image carries no Rust, so the binaries are built here in rust-ci (Ubuntu 22.04,
  # glibc 2.35), which the yi-term image (24.04) runs as is.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: build the head and the base binary
        run: |
          set -euo pipefail
          mkdir -p bins
          cargo build -q -p yi-cli
          cp target/debug/yi bins/head
          git worktree add -q ../base "${{ github.event.pull_request.base.sha }}"
          CARGO_TARGET_DIR="$PWD/target" cargo build -q -p yi-cli --manifest-path ../base/Cargo.toml
          cp target/debug/yi bins/base
      - uses: actions/upload-artifact@v3
        with:
          name: tui-bins
          path: bins/
          retention-days: 1

  # Runs inside the yi-term image itself (Ghostty, Xvfb, pyte), so `tui_see.py ci` plays scenes
  # on the `here` host rather than starting a container of its own.
  shots:
    needs: build
    runs-on: yi-term
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v3
        with:
          name: tui-bins
          path: bins
      - name: snap every scene on base and head, then comment
        env:
          FORGEJO_API_URL: ${{ github.api_url }}
          FORGEJO_REPOSITORY: ${{ github.repository }}
          FORGEJO_PR: ${{ github.event.pull_request.number }}
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          chmod +x bins/base bins/head
          python3 scripts/tui_see.py ci bins/base bins/head
      - uses: actions/upload-artifact@v3
        if: always()
        with:
          name: tui-gallery
          path: target/see/gallery.html
          retention-days: 14
