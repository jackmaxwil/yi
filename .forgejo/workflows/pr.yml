# A thin caller of the justfile the git hooks already run — never a second copy
# of the rules. CI=true makes the aggregator announce-skip binary_size and
# startup: the baseline is a macOS arm64 byte count, and a shared runner cannot
# resolve a 5 ms budget.
#
# The estate has no macOS runner, so the macOS matrix arm of .github/workflows/
# pr.yml is dropped here rather than faked: `just prepush` runs the same three
# lanes on the developer's own mac before every push, which is where macOS
# coverage now comes from. `permissions:` blocks are omitted because Forgejo
# ignores them; the token below is the one the runner scopes to this repo.
name: pr

on:
  pull_request:

jobs:
  gate:
    # `lint`, `guardrails` and `test` are the three lanes of `just check` and
    # none depends on another, so the gate pays the longest rather than the
    # sum. `just lane` is what runs them: it carries prepush's own invariant
    # — that the gate regenerated nothing — into each lane, so splitting the
    # run does not drop it. The rules stay in the justfile (D84); this file
    # only says which lane on which runner.
    strategy:
      fail-fast: false
      matrix:
        lane: [lint, guardrails, test]
    runs-on: ubuntu-latest
    steps:
      # check_commit_style.py resolves origin/main and refuses to pass blind on
      # a shallow clone, so the full history is the gate's precondition.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The image ships just, codespell, uv, cargo-deny, cargo-machete and
      # cargo-nextest, so taiki-e/install-action and the pipx/uv bootstrap the
      # GitHub file carries are both gone. `rustup show` stays: it prints — and
      # installs — whatever rust-toolchain.toml pins, which is the one thing
      # the image can go stale on.
      - run: rustup show
      # The runner's cache server is on, so rust-cache works here as it does on
      # GitHub: one key per lane, shared with postmerge, which is what puts a
      # warm cache on main for a branch's first push to inherit.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.lane }}
          cache-on-failure: true
      - run: just lane ${{ matrix.lane }}

  # Title and body, and only CI can see either: neither exists in the tree the
  # local hook scans, and the body's rule asks the forge whether the issue it
  # cites is open, sized and scheduled (D106) — a question `just check` has no
  # forge to put. Forgejo populates github.event.pull_request.{title,body} on
  # the pull_request event. The job keeps its name because the required context
  # is pinned to it. Its own job, so the three gate lanes do not each re-run a
  # one-second python script.
  title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The body rule measures this branch against the merge base, the way
      # pr_body.py does — the fetch is what gives it an origin/main to find.
      - run: git fetch --no-tags origin main
      - env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          FORGEJO_API_URL: ${{ github.api_url }}
          FORGEJO_REPOSITORY: ${{ github.repository }}
          FORGEJO_PR: ${{ github.event.pull_request.number }}
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/guardrails/check_pr_metadata.py

  size-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: post the measured LOC map and growth verdict
        env:
          FORGEJO_API_URL: ${{ github.api_url }}
          FORGEJO_REPOSITORY: ${{ github.repository }}
          FORGEJO_PR: ${{ github.event.pull_request.number }}
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          python3 scripts/pr_body.py > body.md
          # The narrative is the author's; only the counted sections are
          # machine-truth, so the comment carries those and says so. The first
          # line is also the marker the upsert keys on, so it must not vary.
          {
            echo "Measured against \`origin/main\` by \`just pr-body\` — the sections below are counted, not written."
            echo
            sed -n '/^## Files edited/,$p' body.md | sed -n '/^## Architecture notes/q;p'
          } > comment.md
          # There is no `gh` here: the script does the same edit-in-place over
          # the Forgejo API. One comment per PR — a fresh one per push turns the
          # thread into a changelog nobody reads.
          python3 scripts/forgejo_pr_comment.py comment.md

  # The live lane (D133): the real binary against a real model, judged only by verifiers,
  # `yi doctor` and bands; capped in code. Advisory until its inconclusive rate has earned
  # a required status. Without the OPENROUTER_API_KEY secret it reports inconclusive.
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: live
          cache-on-failure: true
      - run: cargo build -p yi-cli
      - name: run the live suite, or say why not
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p live-out
          if [ -z "${OPENROUTER_API_KEY:-}" ]; then
            echo '{"skipped": "no OPENROUTER_API_KEY secret on this repository"}' > live-out/run.json
            echo "inconclusive: no OPENROUTER_API_KEY secret"
          else
            python3 evals/run.py --live --binary target/debug/yi \
              --model openrouter/deepseek/deepseek-v4-flash-0731 --cap-usd 1 --out live-out || true
          fi
      - name: post the live report
        env:
          FORGEJO_API_URL: ${{ github.api_url }}
          FORGEJO_REPOSITORY: ${{ github.repository }}
          FORGEJO_PR: ${{ github.event.pull_request.number }}
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/live_report.py live-out/run.json > live-body.md
          cat live-body.md
          python3 scripts/forgejo_pr_comment.py live-body.md
