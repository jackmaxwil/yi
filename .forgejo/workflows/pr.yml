# A thin caller of the justfile the git hooks already run — never a second copy
# of the rules. CI=true makes the aggregator announce-skip binary_size and
# startup: the baseline is a macOS arm64 byte count, and a shared runner cannot
# resolve a 5 ms budget.
#
# The estate has no macOS runner, so the macOS matrix arm of .github/workflows/
# pr.yml is dropped here rather than faked: `just prepush` runs the same three
# lanes on the developer's own mac before every push, which is where macOS
# coverage now comes from. `permissions:` blocks are omitted because Forgejo
# ignores them; the token below is the one the runner scopes to this repo.
name: pr

on:
  pull_request:

# A newer push to the same PR supersedes the old run; the old one would only
# hold runners the queue needs (59 of 451 runs kept going after a newer push).
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Each job is capped at 5 CPUs but sees the runner VM's 16; without these,
# cargo and nextest start 16 threads apiece and timing-sensitive tests starve
# (gate (test) failed 41% of runs with 4+ jobs on the runners, 14% with 3 or fewer).
env:
  CARGO_BUILD_JOBS: "5"
  NEXTEST_TEST_THREADS: "5"

jobs:
  gate:
    # `lint`, `guardrails` and `test` are the three lanes of `just check` and
    # none depends on another, so the gate pays the longest rather than the
    # sum. `just lane` is what runs them: it carries prepush's own invariant
    # — that the gate regenerated nothing — into each lane, so splitting the
    # run does not drop it. The rules stay in the justfile (D84); this file
    # only says which lane on which runner.
    strategy:
      fail-fast: false
      matrix:
        lane: [lint, guardrails, test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # check_commit_style.py resolves origin/main and refuses to pass blind on
      # a shallow clone, so the full history is the gate's precondition.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The image ships just, codespell, uv, cargo-deny, cargo-machete and
      # cargo-nextest, so taiki-e/install-action and the pipx/uv bootstrap the
      # GitHub file carries are both gone. `rustup show` stays: it prints — and
      # installs — whatever rust-toolchain.toml pins, which is the one thing
      # the image can go stale on.
      - run: rustup show
      # The runner's cache server is on, so rust-cache works here as it does on
      # GitHub: one key per lane, and postmerge's `warm` job saves every lane's
      # key on main, which is what a branch's first push inherits.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.lane }}
          cache-on-failure: true
          # main saves (postmerge `warm`); a PR's own multi-GB save is readable
          # only by later runs of that PR and costs the shared disk every push.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: just lane ${{ matrix.lane }}

  # Title and body, and only CI can see either: neither exists in the tree the
  # local hook scans, and the body's rule asks the forge whether the issue it
  # cites is open, sized and scheduled (D106) — a question `just check` has no
  # forge to put. Forgejo populates github.event.pull_request.{title,body} on
  # the pull_request event. The job keeps its name because the required context
  # is pinned to it. Its own job, so the three gate lanes do not each re-run a
  # one-second python script.
  title:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The body rule measures this branch against the merge base, the way
      # pr_body.py does — the fetch is what gives it an origin/main to find.
      - run: git fetch --no-tags origin main
      - env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          FORGEJO_API_URL: ${{ github.api_url }}
          FORGEJO_REPOSITORY: ${{ github.repository }}
          FORGEJO_PR: ${{ github.event.pull_request.number }}
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/guardrails/check_pr_metadata.py
      # Was its own `size-report` job: a whole runner slot and clone for a
      # few seconds of python. Runs even when the title check above fails.
      - name: post the measured LOC map and growth verdict
        if: always()
        env:
          FORGEJO_API_URL: ${{ github.api_url }}
          FORGEJO_REPOSITORY: ${{ github.repository }}
          FORGEJO_PR: ${{ github.event.pull_request.number }}
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/pr_body.py > body.md
          # The narrative is the author's; only the counted sections are
          # machine-truth, so the comment carries those and says so. The first
          # line is also the marker the upsert keys on, so it must not vary.
          {
            echo "Measured against \`origin/main\` by \`just pr-body\` — the sections below are counted, not written."
            echo
            sed -n '/^## Files edited/,$p' body.md | sed -n '/^## Architecture notes/q;p'
          } > comment.md
          # There is no `gh` here: the script does the same edit-in-place over
          # the Forgejo API. One comment per PR — a fresh one per push turns the
          # thread into a changelog nobody reads.
          python3 scripts/forgejo_pr_comment.py comment.md

  # The live lane (D133): the real binary against a real model, judged only by verifiers,
  # `yi doctor` and bands; capped in code. Advisory until its inconclusive rate has earned
  # a required status. Without the OPENROUTER_API_KEY secret it reports inconclusive.
  live:
    # Advisory and paid, and 19% of yi's PR runner time: it runs when the PR
    # carries the `live` label at push time (label, then push or re-run).
    if: contains(github.event.pull_request.labels.*.name, 'live')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: rustup show
      # Caches are readable across pull requests only when main saved them, and postmerge
      # saves `test`: the same dev-profile build this step needs. A key of its own stayed cold
      # on every PR, and three cold builds in a row were cancelled by the runner's clock.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build -p yi-cli
      - name: run the live suite, or say why not
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Relace drops the whole cache on a prefix a few tokens past a 256-token page, so the
          # verdict hung on which upstream served the run. postmerge and weekly pin the same one.
          EVAL_ROUTING: '{"order":["deepinfra"],"allow_fallbacks":false}'
        run: |
          set -euo pipefail
          mkdir -p live-out
          if [ -z "${OPENROUTER_API_KEY:-}" ]; then
            echo '{"skipped": "no OPENROUTER_API_KEY secret on this repository"}' > live-out/run.json
            echo "inconclusive: no OPENROUTER_API_KEY secret"
          else
            python3 evals/run.py --live --binary target/debug/yi \
              --model openrouter/deepseek/deepseek-v4-flash-0731 --cap-usd 1 --out live-out || true
          fi
          # A ratchet speaks only when every run of this head crossed it (#480): one draw of an upstream
          # is noise, so while one still holds the suite runs again, three runs at most.
          python3 scripts/live_ledger.py baseline live-out/run.json > live-baseline.json || echo '{}' > live-baseline.json
          runs=(live-out/run.json)
          for n in 2 3; do
            python3 scripts/live_ledger.py again live-baseline.json "${runs[@]}" || break
            python3 evals/run.py --live --binary target/debug/yi \
              --model openrouter/deepseek/deepseek-v4-flash-0731 --cap-usd 1 --out "live-again-$n" || true
            runs+=("live-again-$n/run.json")
          done
      # An OpenRouter Claude route caches nothing without explicit marks, and the DeepSeek run above
      # cannot see that: its upstream caches on its own (#742). `cache-warm-claude` is a tool loop
      # whose every warm request must read 90% of the previous request's whole prompt, writes
      # included, so a lost or misplaced tail mark is red. The verdict is the cache's alone (its
      # reward); a red doctor row is the report's. The pin is this route's, not the ledger's, so it
      # is not EVAL_ROUTING. The job stays advisory; a red here names a real loss.
      - name: a Claude route reads its warm prefix
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLAUDE_ROUTING: '{"order":["amazon-bedrock"],"allow_fallbacks":false}'
        run: |
          set -euo pipefail
          if [ -z "${OPENROUTER_API_KEY:-}" ]; then echo "inconclusive: no OPENROUTER_API_KEY secret"; exit 0; fi
          EVAL_ROUTING="$CLAUDE_ROUTING" python3 evals/run.py --live --task cache-warm-claude --binary target/debug/yi \
            --model openrouter/anthropic/claude-haiku-4.5 --cap-usd 0.2 --out live-claude || true
          python3 - <<'EOF'
          import json, sys
          try:
              row = json.load(open("live-claude/run.json"))["rows"][0]
          except (OSError, ValueError, KeyError, IndexError) as error:
              sys.exit(print(f"inconclusive: {error}"))
          print(f"cache reward {row.get('reward')}, {row.get('status')}: {row.get('detail') or 'ok'}; warm shares {row.get('warmShares')}")
          sys.exit(0 if row.get("status") == "inconclusive" or row.get("reward") == 1 else 1)
          EOF
      - name: post the live report
        # Steps stop at the first red one; the DeepSeek verdict is owed either way.
        if: always()
        env:
          FORGEJO_API_URL: ${{ github.api_url }}
          FORGEJO_REPOSITORY: ${{ github.repository }}
          FORGEJO_PR: ${{ github.event.pull_request.number }}
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The baseline is the last runs like this one on the telemetry branch; the verdict names every
          # band and ratchet the run breaks. Advisory: the comment says RED, the job stays green.
          python3 scripts/live_ledger.py judge live-out/run.json live-baseline.json live-again-*/run.json > live-verdict.json || true
          python3 scripts/live_report.py live-out/run.json live-verdict.json live-baseline.json > live-body.md
          cat live-body.md
          # The report is above either way; a comment that will not post is said, not waited on.
          python3 scripts/forgejo_pr_comment.py live-body.md || echo "live: comment not posted"
