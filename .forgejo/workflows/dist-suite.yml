# The suite under the profile that ships, with panic forced back to unwind,
# which nothing else covers because the shipping profile aborts. It ran on
# every push to main until #304 measured it at seven of postmerge's eight
# minutes; nothing gates on it, so it runs nightly and on demand.
name: dist-suite

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dist-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4 # zizmor: ignore[unpinned-uses] Forgejo mirror SHA is unverified offline.
        with:
          persist-credentials: false
      - run: rustup show
      # Its own key: the dist profile shares no artifact with the `test` lane.
      - uses: Swatinem/rust-cache@v2 # zizmor: ignore[unpinned-uses] Forgejo mirror SHA is unverified offline.
        with:
          shared-key: dist-suite
          cache-on-failure: true
      # Incident: a fat-LTO test link takes most of the job's 5g alone, and two at once were
      # SIGKILLed every night from 11-18; one build job links one binary at a time.
      - run: just dist-suite
        env:
          CARGO_BUILD_JOBS: 1
