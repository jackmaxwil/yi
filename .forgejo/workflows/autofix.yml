# The autofixer (scripts/pr_autofix.py): after every push to main and every 15 minutes, oldest PR first,
# it merges main into a behind PR by git alone when possible, or resolves real conflicts and blocked
# findings with a fresh `yi ask` once the PR has been quiet two hours (or carries `autofix`). It commits
# agent fixes through the hooks and pushes as yi-bot. Labels: autofix, autofix:hold, autofix:working, autofix:failed.
name: autofix

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

# One pass at a time: the lock the `autofix:working` label only shows.
concurrency:
  group: autofix
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: "5"

permissions:
  contents: read

jobs:
  autofix:
    runs-on: ubuntu-latest
    # The one place the autofix job's limit is set; pr_autofix.py budgets its pass from it, and the
    # runner's own cap (the infra repository CI_RUNNER_JOB_TIMEOUT, 120m) bounds it.
    timeout-minutes: 90
    steps:
      - name: install fgj
        run: |
          set -euo pipefail
          curl -fsSL -o /usr/local/bin/fgj https://codeberg.org/romaintb/fgj/releases/download/v0.5.0/fgj_linux_amd64
          echo "7a161b57355ba6216eb12d2d185dc8b47a94efec06116ef4f6efa5e5eea06b39  /usr/local/bin/fgj" | sha256sum -c -
          chmod +x /usr/local/bin/fgj
      # Incident: the group queues every scheduled pass behind the running one, and a runner backlog
      # stacked eleven, each a full build and pass over the same PRs (2026-10-12). The newest does it.
      - name: skip a pass a newer queued one repeats
        id: queue
        env:
          FGJ_TOKEN: ${{ secrets.REVIEW_BOT_TOKEN }}
        run: |
          newer=$(fgj api --hostname git.example.invalid "repos/${{ github.repository }}/actions/runs?status=waiting" \
            | python3 -c 'import json,sys; print(sum(r["workflow_id"] == "autofix.yml" and r["id"] > ${{ github.run_id }} for r in json.load(sys.stdin)["workflow_runs"]))' \
            || echo 0)
          echo "newer=$newer" >> "$GITHUB_OUTPUT"
          [ "$newer" = 0 ] || echo "autofix: skipped, $newer newer pass(es) queued"
      # Main's tree: the PR's code and the model run only in a worker under a throwaway uid.
      - if: steps.queue.outputs.newer == '0'
        uses: actions/checkout@v4 # zizmor: ignore[unpinned-uses,artipacked] Mirror SHA is unverified offline; the fixer fetches PR heads with the checkout's scoped token.
        with:
          ref: main
          fetch-depth: 0
      # A job's HOME starts with no skills, and this copy is main's, not the PR's tree.
      # The worker gets a copy; this one stays root's (pr_autofix.in_worker).
      - if: steps.queue.outputs.newer == '0'
        run: just install-skills
      - if: steps.queue.outputs.newer == '0'
        run: rustup show
      - if: steps.queue.outputs.newer == '0'
        uses: Swatinem/rust-cache@v2 # zizmor: ignore[unpinned-uses] Forgejo mirror SHA is unverified offline.
        with:
          shared-key: test
          cache-on-failure: true
          save-if: false
      # The low tier goes to wafer/mxfp4 first, as in review.yml; no fallback ban, because the higher
      # tiers' models may not be on wafer/mxfp4 and a strict pin would refuse them.
      - if: steps.queue.outputs.newer == '0'
        run: mkdir -p ~/.yi && echo '{"routing":{"order":["wafer/mxfp4"]}}' > ~/.yi/config.json
      - name: fix conflicted PRs as yi-bot
        if: steps.queue.outputs.newer == '0'
        env:
          FGJ_TOKEN: ${{ secrets.REVIEW_BOT_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # The rounds the findings fixer answers: the bot's and the owner's, as the review job counts them.
          YI_ROUND_AUTHORS: yi-bot,jack
        run: |
          set -euo pipefail
          if [ -z "${FGJ_TOKEN:-}" ] || [ -z "${OPENROUTER_API_KEY:-}" ]; then
            echo "autofix: skipped, the REVIEW_BOT_TOKEN or OPENROUTER_API_KEY secret is not set"
            exit 0
          fi
          login=$(fgj api --hostname git.example.invalid user | python3 -c 'import json,sys; print(json.load(sys.stdin).get("login", ""))')
          [ "$login" = yi-bot ] || { echo "autofix: fgj is signed in as '$login', not yi-bot"; exit 1; }
          # The first model call of a pass with a PR to fix builds yi and refreshes the catalog
          # (pr_review.yi_bin); a pass with nothing to fix pays for neither.
          # Incident: /tmp is the job's 2 GB tmpfs, and the fixer's clones and the lanes it runs there
          # filled it: #1111's fix died "Out of diskspace", and a 64 MB spill test failed in the clone.
          # Incident: a `..` here walked lexically through the checkout, so a head without the dotted-path
          # fix found its `.git` and priced its AGENTS.md into every bare role prefix, 45 KB (#1805).
          export TMPDIR="$(dirname "$GITHUB_WORKSPACE")/autofix-tmp"
          mkdir -p "$TMPDIR"
          just pr autofix
