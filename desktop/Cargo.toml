[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/sources",
    "crates/ui",
    "crates/panes",
    "crates/mac",
    "crates/app",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.99.1"
publish = false

[workspace.dependencies]
yd-core = { path = "crates/core" }
yd-sources = { path = "crates/sources" }
yd-ui = { path = "crates/ui" }
yd-panes = { path = "crates/panes" }
yd-mac = { path = "crates/mac" }
# Rune's default features minus ogg-audio (MPL-2.0 codecs this app never plays) and dbus (Linux only).
rune = { git = "https://github.com/jackmaxwil/rune", rev = "1fab9bb198b9ae935b976c8c0a5d0bb516cb6841", default-features = false, features = ["accessibility", "embedded-fonts", "metal-backend", "svg", "native-file-dialog"] }
rune-kit = { git = "https://github.com/jackmaxwil/rune", rev = "1fab9bb198b9ae935b976c8c0a5d0bb516cb6841", features = ["markdown"] }
rune-luau = { git = "https://github.com/jackmaxwil/rune", rev = "1fab9bb198b9ae935b976c8c0a5d0bb516cb6841" }
rune-notify = { git = "https://github.com/jackmaxwil/rune", rev = "1fab9bb198b9ae935b976c8c0a5d0bb516cb6841" }
yi-types = { path = "../crates/types" }
# Yi's client-local browser crate: Chrome frames for the web pane.
yi-browser = { path = "../crates/browser" }
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
thiserror = { version = "2.0.21", default-features = false, features = ["std"] }
vt100 = { version = "0.15", default-features = false }
# Already in the lock through Rune; decodes the browser's frames.
base64 = { version = "0.22", default-features = false, features = ["std"] }
# Already in the lock through Rune at this version; decodes the browser's frames on the source's thread.
png = { version = "0.18", default-features = false }
rustix = { version = "0.38", default-features = false, features = ["fs", "process", "std", "stdio"] }
objc2 = "0.5.2"
block2 = "0.5"
objc2-foundation = { version = "0.2.2", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.2.2", default-features = false, features = ["std"] }

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
# Yi publishes no crate: `pub` means "visible to the next crate up", never docs.rs, so a
# public doc naming a private item is normal here and the lint is a library concern (D55).
private_intra_doc_links = "allow"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unreachable = "deny"
unimplemented = "deny"
await_holding_lock = "deny"
await_holding_invalid_type = "deny"
disallowed_methods = "deny"

# Mirrors the root workspace's dev profile: desktop/ is its own workspace root, so Cargo
# reads only this table here. Change both together.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# The forge's test build. Incident: with dependencies unoptimised the app's tests, which lay out
# and draw every frame on the CPU, took 14 of the desktop lane's 19 minutes against a limit of 20.
[profile.gate]
inherits = "dev"

[profile.gate.package."*"]
opt-level = 1

# Rune's own release profile: an app that links Rune builds it the way Rune measures it.
[profile.release]
codegen-units = 16
incremental = true

# What the bundle ships: Rune's release, with an arithmetic overflow a loud stop, not a wrap.
[profile.dist]
inherits = "release"
overflow-checks = true

# Rune's five patched crates: a dependency's `[patch]` does not reach the workspace that
# depends on it, so an app that builds Rune repeats them.
[patch.crates-io]
wgpu-hal = { git = "https://github.com/jackmaxwil/rune", rev = "1fab9bb198b9ae935b976c8c0a5d0bb516cb6841" }
winit = { git = "https://github.com/jackmaxwil/rune", rev = "1fab9bb198b9ae935b976c8c0a5d0bb516cb6841" }
parley_engine = { git = "https://github.com/jackmaxwil/rune", rev = "1fab9bb198b9ae935b976c8c0a5d0bb516cb6841" }
accesskit_windows = { git = "https://github.com/jackmaxwil/rune", rev = "1fab9bb198b9ae935b976c8c0a5d0bb516cb6841" }
accesskit_macos = { git = "https://github.com/jackmaxwil/rune", rev = "1fab9bb198b9ae935b976c8c0a5d0bb516cb6841" }
