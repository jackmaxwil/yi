[workspace]
resolver = "3"
members = [
  "crates/types",
  "crates/loop",
  "crates/ai",
  "crates/oauth",
  "crates/orb",
  "crates/session",
  "crates/context",
  "crates/permission",
  "crates/tools",
  "crates/mcp-cli",
  "crates/kernel",
  "crates/runtime",
  "crates/acp",
  "crates/tui",
  "crates/console",
  "crates/cli",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
rust-version = "1.94"

[workspace.dependencies]
yi-oauth = { path = "crates/oauth" }
yi-types = { path = "crates/types" }
yi-loop = { path = "crates/loop" }
yi-ai = { path = "crates/ai" }
yi-orb = { path = "crates/orb" }
yi-session = { path = "crates/session" }
yi-context = { path = "crates/context" }
yi-permission = { path = "crates/permission" }
yi-tools = { path = "crates/tools" }
yi-mcp-cli = { path = "crates/mcp-cli" }
yi-kernel = { path = "crates/kernel" }
yi-runtime = { path = "crates/runtime" }
yi-acp = { path = "crates/acp" }
yi-tui = { path = "crates/tui" }
yi-console = { path = "crates/console" }
yi-cli = { path = "crates/cli" }
serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1", default-features = false, features = ["std", "preserve_order"] }
thiserror = { version = "2", default-features = false, features = ["std"] }
lexopt = { version = "0.3", default-features = false }
globset = { version = "0.4", default-features = false }
# Unbanned 2026-08-29 with its first consumer (grep v2). `std` + `perf` plus
# only the case-folding table (`unicode-case`, which `case_insensitive`
# requires); the full Unicode tables stay out. The engine crates underneath
# were already in the lock via globset. Ledger row records the measured delta.
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-case"] }
xxhash-rust = { version = "0.8", default-features = false, features = ["xxh32"] }
sha2 = { version = "0.10", default-features = false }
hmac = { version = "0.12", default-features = false }
tokio = { version = "1", default-features = false, features = ["rt", "sync", "time", "macros", "process", "io-util", "net"] }
zeromq = { version = "0.6", default-features = false, features = ["tokio-runtime", "tcp-transport"] }
ureq = { version = "2", default-features = false, features = ["tls", "native-certs"] }
ratatui = { version = "0.29", default-features = false, features = ["crossterm", "scrolling-regions"] }
tui-textarea = { version = "0.7", default-features = false, features = ["crossterm"] }
pulldown-cmark = { version = "0.12", default-features = false }
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
unicode-width = { version = "0.2", default-features = false }
miniz_oxide = { version = "0.9", default-features = false, features = ["with-alloc"] }
vt100 = { version = "0.15", default-features = false }
insta = { version = "1", default-features = false }
proptest = { version = "1", default-features = false, features = ["std"] }
rmcp = { version = "3", default-features = false, features = ["server", "transport-io", "macros"] }

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
# Yi publishes no crate: `pub` means "visible to the next crate up", never docs.rs, so a
# public doc naming a private item is normal here and the lint is a library concern (D55).
private_intra_doc_links = "allow"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
await_holding_lock = "deny"
await_holding_invalid_type = "deny"
disallowed_methods = "deny"

# Debug builds carry line tables only, and dependencies carry no debuginfo at
# all: generating it and linking it into 101 test binaries was a fifth of the
# PR gate's wall clock, and a backtrace through serde's frames is not what
# anyone reads. `file:line` on Yi's own frames survives.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dist]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
incremental = false

[profile.dist.package."*"]
opt-level = "z"
