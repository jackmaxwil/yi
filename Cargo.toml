[workspace]
resolver = "3"
members = [
  "crates/types",
  "crates/loop",
  "crates/ai",
  "crates/orb",
  "crates/session",
  "crates/context",
  "crates/permission",
  "crates/tools",
  "crates/mcp-cli",
  "crates/kernel",
  "crates/runtime",
  "crates/acp",
  "crates/tui",
  "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.94"

[workspace.dependencies]
yi-types = { path = "crates/types" }
yi-loop = { path = "crates/loop" }
yi-ai = { path = "crates/ai" }
yi-orb = { path = "crates/orb" }
yi-session = { path = "crates/session" }
yi-context = { path = "crates/context" }
yi-permission = { path = "crates/permission" }
yi-tools = { path = "crates/tools" }
yi-mcp-cli = { path = "crates/mcp-cli" }
yi-kernel = { path = "crates/kernel" }
yi-runtime = { path = "crates/runtime" }
yi-acp = { path = "crates/acp" }
yi-tui = { path = "crates/tui" }
yi-cli = { path = "crates/cli" }
serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1", default-features = false, features = ["std", "preserve_order"] }
thiserror = "2"
lexopt = "0.3"
globset = { version = "0.4", default-features = false }
xxhash-rust = { version = "0.8", default-features = false, features = ["xxh32"] }
sha2 = { version = "0.10", default-features = false }
hmac = { version = "0.12", default-features = false }
tokio = { version = "1", default-features = false, features = ["rt", "sync", "time", "macros", "process", "io-util", "net"] }
zeromq = { version = "0.6", default-features = false, features = ["tokio-runtime", "tcp-transport"] }
ureq = { version = "2", default-features = false, features = ["tls", "native-certs"] }
ratatui = { version = "0.29", default-features = false, features = ["crossterm", "scrolling-regions"] }
tui-textarea = { version = "0.7", default-features = false, features = ["crossterm"] }
pulldown-cmark = { version = "0.12", default-features = false }
unicode-width = { version = "0.2", default-features = false }
miniz_oxide = { version = "0.9", default-features = false, features = ["with-alloc"] }
vt100 = "0.15"
insta = { version = "1", default-features = false }
rmcp = { version = "3", default-features = false, features = ["server", "transport-io", "macros"] }

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
# Yi publishes no crate: `pub` means "visible to the next crate up", never docs.rs, so a
# public doc naming a private item is normal here and the lint is a library concern (D55).
private_intra_doc_links = "allow"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
await_holding_lock = "deny"
await_holding_invalid_type = "deny"
disallowed_methods = "deny"

[profile.dist]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
incremental = false

[profile.dist.package."*"]
opt-level = "z"
