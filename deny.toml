[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "CDLA-Permissive-2.0"]

[bans]
multiple-versions = "deny"
deny = [
  "reqwest", "hyper", "openssl-sys", "native-tls",
  "git2", "libgit2-sys", "gix", "regex", "clap", "anyhow", "chrono",
  "once_cell", "lazy_static", "rand", "syntect", "textwrap", "toml",
  "tracing-subscriber",
]

[advisories]
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
