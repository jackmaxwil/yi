# Dev-deps never ship; targets limited to the platforms Yi builds for (drops
# wasm/windows-only subtrees from the ban graph).
[graph]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
exclude-dev = true

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "CDLA-Permissive-2.0", "BSL-1.0"]

[bans]
multiple-versions = "deny"
# once_cell: banned for direct use (std OnceLock); rustls/ureq pull it transitively.
# syn 2+3 duplicate: proc-macro build deps only, zero runtime bytes.
# zeromq wrappers: the pure-Rust zmq stack pins rand/regex/dashmap internals
# (design 13.3 — libzmq FFI rejected by rule 4; these stay wire-internal to
# the kernel channels and never cross into Yi code).
deny = [
  "reqwest", "hyper", "openssl-sys", "native-tls",
  "git2", "libgit2-sys", "gix", "clap", "anyhow",
  { crate = "regex", wrappers = ["zeromq"] },
  { crate = "chrono", wrappers = ["rmcp"] },
  { crate = "once_cell", wrappers = ["rustls", "ureq", "tracing-core", "zeromq"] },
  { crate = "rand", wrappers = ["zeromq"] },
  "lazy_static", "syntect", "textwrap", "toml",
  "tracing-subscriber",
]
# base64 0.22/0.23 duplicate: ureq 2 pins 0.22, rmcp pins 0.23; collapses when
# ureq 3 migration lands (advisories note above).
# thiserror 1+2 and getrandom 0.2/0.3 duplicates ride the zeromq pin; both
# collapse when zeromq updates its error/rand stack.
# hashbrown 0.14/0.15 and unicode-width 0.1/0.2 duplicates ride the ratatui
# 0.29 tree (lru pins hashbrown 0.15, unicode-truncate pins unicode-width 0.1);
# both collapse when ratatui's pins catch up (D41, §13.4 tui).
skip = [
  { crate = "syn" },
  { crate = "windows-sys" },
  { crate = "base64" },
  { crate = "thiserror" },
  { crate = "thiserror-impl" },
  { crate = "getrandom" },
  { crate = "hashbrown" },
  { crate = "unicode-width" },
]

[advisories]
yanked = "deny"
ignore = [
  { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile archived; pulled only by ureq 2 native-certs. Remove on the planned ureq 3 + rustls-platform-verifier migration (size-ledger item)." },
  { id = "RUSTSEC-2024-0436", reason = "paste unmaintained; proc-macro build dep of ratatui 0.29, zero runtime bytes. Drops when ratatui replaces it (D41, §13.4 tui)." },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
