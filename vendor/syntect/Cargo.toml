# syntect 5.3.0 as published, with three changes so the dist binary links only the Unicode
# tables bat's grammars use (yi D263): `regex-syntax` and `fancy-regex` lose their default
# features, which switched on every table (age, script, segment included), and the four the
# grammars need (perl, case, general category, bool) plus the Unicode word boundary are named
# below. The examples, tests, benches, dev-dependencies and profiles are dropped with the
# files they point at. Everything under src/ is upstream's, byte for byte.
#
# THIS FILE IS AUTOMATICALLY GENERATED BY CARGO
#
# When uploading crates to the registry Cargo will automatically
# "normalize" Cargo.toml files for maximal compatibility
# with all versions of Cargo and also rewrite `path` dependencies
# to registry (e.g., crates.io) dependencies.
#
# If you are reading this file be aware that the original Cargo.toml
# will likely look very different (and much more reasonable).
# See Cargo.toml.orig for the original contents.

[package]
edition = "2021"
name = "syntect"
version = "5.3.0"
authors = ["Tristan Hume <tristan@thume.ca>"]
build = false
exclude = [
    "testdata/*",
    "/scripts/*",
    "/Makefile",
    "/codecov.yml",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "library for high quality syntax highlighting and code intelligence using Sublime Text's grammars"
documentation = "https://docs.rs/syntect"
readme = "Readme.md"
keywords = [
    "syntax",
    "highlighting",
    "highlighter",
    "colouring",
    "parsing",
]
categories = [
    "parser-implementations",
    "parsing",
    "text-processing",
]
license = "MIT"
repository = "https://github.com/trishume/syntect"

[package.metadata.docs.rs]
features = ["metadata"]

[features]
default = ["default-onig"]
default-fancy = [
    "parsing",
    "default-syntaxes",
    "default-themes",
    "html",
    "plist-load",
    "yaml-load",
    "dump-load",
    "dump-create",
    "regex-fancy",
]
default-onig = [
    "parsing",
    "default-syntaxes",
    "default-themes",
    "html",
    "plist-load",
    "yaml-load",
    "dump-load",
    "dump-create",
    "regex-onig",
]
default-syntaxes = [
    "parsing",
    "dump-load",
]
default-themes = ["dump-load"]
dump-create = [
    "flate2",
    "bincode",
]
dump-load = [
    "flate2",
    "bincode",
]
html = ["parsing"]
metadata = [
    "parsing",
    "plist-load",
    "dep:serde_json",
]
parsing = [
    "regex-syntax",
    "fnv",
    "dump-create",
    "dump-load",
]
plist-load = [
    "plist",
    "dep:serde_json",
]
regex-fancy = ["fancy-regex", "regex-automata"]
regex-onig = ["onig"]
yaml-load = [
    "yaml-rust",
    "parsing",
]

[lib]
name = "syntect"
path = "src/lib.rs"
bench = false

[dependencies.bincode]
version = "1.0"
optional = true

[dependencies.fancy-regex]
version = "0.16.2"
optional = true
default-features = false
features = ["std", "perf"]

[dependencies.flate2]
version = "1.0"
optional = true

[dependencies.fnv]
version = "1.0"
optional = true

[dependencies.once_cell]
version = "1.8"

[dependencies.onig]
version = "6.5.1"
optional = true
default-features = false

[dependencies.plist]
version = "1.3"
optional = true

[dependencies.regex-syntax]
version = "0.8"
optional = true
default-features = false
features = ["std", "unicode-perl", "unicode-case", "unicode-gencat", "unicode-bool"]

[dependencies.regex-automata]
version = "0.4"
optional = true
default-features = false
features = ["std", "unicode-perl", "unicode-case", "unicode-gencat", "unicode-bool", "unicode-word-boundary"]

[dependencies.serde]
version = "1.0"

[dependencies.serde_derive]
version = "1.0"

[dependencies.serde_json]
version = "1.0"
optional = true

[dependencies.thiserror]
version = "2.0.12"

[dependencies.walkdir]
version = "2.0"

[dependencies.yaml-rust]
version = "0.4.5"
optional = true
