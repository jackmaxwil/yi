experimental = ["wrapper-scripts"]

[profile.default]
retries = 1
slow-timeout = { period = "30s", terminate-after = 2 }

[scripts.wrapper.tmp-sandbox]
command = { command-line = "scripts/test_tmp.sh", relative-to = "workspace-root" }

[[profile.default.scripts]]
filter = "all()"
run-wrapper = "tmp-sandbox"

[test-groups]
kernel = { max-threads = 1 }
# Invariant: these grouped workloads spawn Yi/Cargo or sync many files; an unbounded pool oversubscribes.
# Incident: 14 timed out in 121.9s; capped at three, all 671 passed in 66.4s; local widens selected suites to eight.
subprocess = { max-threads = 3 }
# The `local` profile's wider cap: a 16-core Mac ran the suite in 83-85 s at eight against
# 103-140 s at three, same CPU. CI keeps the default profile and its three.
subprocess-wide = { max-threads = 8 }

[[profile.default.overrides]]
filter = '''
binary(ready_check) + binary(request_budget)
| (package(yi-cli) & binary(integration) & test(/^(cli_surfaces|tui_drive|mcp_oauth|acp_protocol|serve_daemon|mcp_cli|rpc_protocol|journeys)::/))
| (package(yi-tools) & binary(integration) & test(/^(orient|tools)::/))
'''
test-group = 'subprocess'

[[profile.default.overrides]]
filter = 'test(child_forks::the_dep_info_count_holds_at_its_limit_and_refuses_one_past)'
test-group = 'subprocess'
priority = 100

# Longest first: 10-45 s each, and each reached late in scheduling order. In a run whose
# other work ended at 57 s, plan_fuzz started at 26 s and held the run open to 70 s.
# Priority moves the start, not the test: every one still runs, under the same timeout.
# plan_fuzz and the dirty-tree accept left the list once they fit in a few seconds (#721).
[[profile.default.overrides]]
filter = '''
test(a_last_word_that_streams_for_twenty_seconds_lands_inside_the_deadline)
| test(telemetry_writes_spans_beside_the_session_and_stats_rolls_them_up)
| test(the_primary_role_supplies_the_model)
| test(agent_messages_route_by_name_and_broadcast_with_receipts)
| test(a_large_sheet_points_at_a_pandas_route_that_works)
'''
priority = 100
[[profile.default.overrides]]
filter = '''
test(permission_scope::a_link_swapped_after_the_check_reads_no_key)
| test(permission_scope::a_parent_swapped_after_the_check_reads_no_key)
| test(permission_scope::a_link_swapped_after_the_check_overwrites_no_key)
| test(permission_scope::a_parent_swapped_after_the_check_overwrites_no_key)
'''
test-group = 'subprocess'
priority = 100

[profile.local]
inherits = "default"

[[profile.local.overrides]]
filter = '''
binary(ready_check) + binary(request_budget)
| (package(yi-cli) & binary(integration) & test(/^(cli_surfaces|tui_drive|mcp_oauth|acp_protocol|serve_daemon|mcp_cli|rpc_protocol|journeys)::/))
| (package(yi-tools) & binary(integration) & test(/^(orient|tools)::/))
'''
test-group = 'subprocess-wide'
[profile.timing]
inherits = "local"

[profile.timing.junit]
path = "timing.xml"

