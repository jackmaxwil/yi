[package]
name = "yi-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
# One test binary, not one per file: tests/integration.rs names the modules.
autotests = false

[lints]
workspace = true

[dependencies]
thiserror = { workspace = true }
yi-types = { workspace = true }
yi-loop = { workspace = true }
yi-ai = { workspace = true }
yi-context = { workspace = true }
yi-session = { workspace = true }
yi-tools = { workspace = true }
yi-permission = { workspace = true }
yi-kernel = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
globset = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

# The two harnesses a guardrail runs by name (`--test behavior`, `--test request_budget`)
# keep their own binaries; everything else is a module of `integration`.
[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "behavior"
path = "tests/behavior.rs"

[[test]]
name = "request_budget"
path = "tests/request_budget.rs"
